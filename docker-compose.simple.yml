version: '3.8'

services:
  socgo:
    image: socgo:latest
    container_name: socgo-app
    restart: unless-stopped
    ports:
      - "40378:8081"
    volumes:
      - ./config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
