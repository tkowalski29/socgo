version: '3.8'

services:
  socgo:
    image: ghcr.io/tkowalski29/socgo:v0.0.4
    container_name: socgo-app
    restart: unless-stopped
    ports:
      - "40378:8080"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - socgo_data:/app/data
      - socgo_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  socgo_data:
    driver: local
  socgo_uploads:
    driver: local
